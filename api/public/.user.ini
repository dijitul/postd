; PHP-FPM reads this per directory, so these limits ship with the code
; instead of living only in the server's php.ini.
;
; Photo uploads: phone photos are routinely 3 to 12MB, and the server
; default of 2MB turned every one of them away. The app caps uploads at
; 15MB itself (ImageController).
upload_max_filesize = 16M
post_max_size = 20M

; Decoding a 48 megapixel phone photo with GD takes about 190MB before it
; is resized, beyond the default 128M.
memory_limit = 512M
