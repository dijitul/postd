name: Deploy postd.uk

# Triggers on every push to the main branch.
# Only one deployment runs at a time — the concurrency group prevents
# overlapping deploys if two commits land in quick succession.

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false  # Never cancel an in-flight deploy; queue instead

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Run backend tests and validate the PHP codebase
  # ---------------------------------------------------------------------------
  test-api:
    name: API Tests (PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postduk_test
          POSTGRES_USER: postduk
          POSTGRES_PASSWORD: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pgsql, pdo_pgsql, redis, xml, zip, gd, bcmath, intl, pcntl, dom
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        working-directory: api
        run: composer validate

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: api/vendor
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        working-directory: api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy test .env
        working-directory: api
        run: |
          cp .env.example .env.testing
          # Override for the CI test database
          sed -i 's/DB_DATABASE=postduk/DB_DATABASE=postduk_test/' .env.testing
          sed -i 's/DB_USERNAME=postduk/DB_USERNAME=postduk/' .env.testing
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=testing/' .env.testing
          sed -i 's/APP_ENV=production/APP_ENV=testing/' .env.testing

      - name: Generate application key
        working-directory: api
        run: php artisan key:generate --env=testing

      - name: Run database migrations
        working-directory: api
        run: php artisan migrate --env=testing --force

      - name: Run PHPUnit tests
        working-directory: api
        run: php artisan test --parallel

  # ---------------------------------------------------------------------------
  # Job 2: Build the React frontend
  # ---------------------------------------------------------------------------
  build-web:
    name: Build React PWA (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Build production bundle
        working-directory: web
        env:
          VITE_API_URL: https://api.postd.uk
          VITE_APP_NAME: postd.uk
        run: npm run build

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 3: Deploy to production server (only after tests + build pass)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to production (144.126.207.135)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-web]

    environment:
      name: production
      url: https://postd.uk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download built frontend
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pgsql, redis, xml, zip, gd, bcmath
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: api/vendor
          key: composer-prod-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-prod-

      - name: Install production PHP dependencies
        working-directory: api
        run: composer install --prefer-dist --no-dev --no-interaction --no-progress --optimize-autoloader

      - name: Copy production build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "web/dist/"
          target: "/var/www/postd/"
          strip_components: 0

      - name: Copy PHP vendor to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "api/vendor/"
          target: "/var/www/postd/"
          strip_components: 0

      - name: Deploy application on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            echo "=== postd.uk deployment — $(date) ==="
            echo "=== Commit: ${{ github.sha }} ==="
            echo "=== Triggered by: ${{ github.actor }} ==="

            APP_DIR="/var/www/postd"
            API_DIR="$APP_DIR/api"

            # ------------------------------------------------------------------
            # 1. Enable maintenance mode (shows a clean 503 to users)
            # ------------------------------------------------------------------
            echo "--- Enabling maintenance mode..."
            php "$API_DIR/artisan" down \
              --render="errors::503" \
              --retry=60 \
              --secret="${{ secrets.DEPLOY_BYPASS_SECRET }}" || true

            # ------------------------------------------------------------------
            # 2. Pull latest code
            # ------------------------------------------------------------------
            echo "--- Pulling latest code..."
            cd "$APP_DIR"
            git fetch --all
            git reset --hard origin/main

            # ------------------------------------------------------------------
            # 3. Run database migrations
            # ------------------------------------------------------------------
            echo "--- Running migrations..."
            php "$API_DIR/artisan" migrate --force

            # ------------------------------------------------------------------
            # 4. Clear and rebuild all Laravel caches
            # ------------------------------------------------------------------
            echo "--- Rebuilding caches..."
            php "$API_DIR/artisan" config:cache
            php "$API_DIR/artisan" route:cache
            php "$API_DIR/artisan" view:cache
            php "$API_DIR/artisan" event:cache

            # ------------------------------------------------------------------
            # 5. Fix storage permissions (in case new log/cache dirs were created)
            # ------------------------------------------------------------------
            echo "--- Fixing storage permissions..."
            chmod -R 775 "$API_DIR/storage" "$API_DIR/bootstrap/cache"

            # ------------------------------------------------------------------
            # 6. Bring the application back up
            # ------------------------------------------------------------------
            echo "--- Bringing application back online..."
            php "$API_DIR/artisan" up

            # ------------------------------------------------------------------
            # 7. Restart Horizon gracefully
            # The horizon:terminate command tells the current Horizon process to
            # finish its current jobs then exit. Supervisor will immediately
            # start a fresh Horizon process with the new code.
            # ------------------------------------------------------------------
            echo "--- Restarting Horizon queue workers..."
            php "$API_DIR/artisan" horizon:terminate || true
            sudo /usr/bin/supervisorctl restart postd-horizon

            # ------------------------------------------------------------------
            # 8. Health check — verify the API responds
            # ------------------------------------------------------------------
            echo "--- Running health check..."
            sleep 5
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 30 \
              https://api.postd.uk/health 2>/dev/null || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "--- Health check PASSED (HTTP $HTTP_STATUS)"
            else
              echo "--- Health check FAILED (HTTP $HTTP_STATUS) — manual review needed!"
              # Note: we don't fail the deploy here as the health endpoint
              # may not exist yet. Remove this comment once /health is implemented.
            fi

            echo "=== Deployment complete at $(date) ==="

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment to postd.uk FAILED!"
          echo "::error::Commit: ${{ github.sha }}"
          echo "::error::Review the steps above and check server logs at:"
          echo "::error::/var/www/postd/api/storage/logs/laravel.log"
          echo "::error::/var/www/postd/api/storage/logs/horizon.log"
