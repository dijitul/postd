<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!--
      Page-specific tags (title, description, robots, canonical, Open Graph,
      Twitter card, JSON-LD) are written per route by scripts/prerender.mjs
      in place of the marker below, and kept up to date in the browser by
      <Seo /> (src/lib/head.jsx). Do not hard-code them here.
    -->
    <!--app-head-->
    <meta name="author" content="dijitul, Mansfield" />

    <!-- Theme -->
    <meta name="theme-color" content="#E07B30" />
    <meta name="msapplication-TileColor" content="#1E2D4A" />
    <meta name="msapplication-navbutton-color" content="#E07B30" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="postd.uk" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon / Icons -->
    <link rel="icon" type="image/svg+xml" href="/brand/icon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/icon-96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Twitter / X account -->
    <meta name="twitter:site" content="@postduk" />

    <!-- Google Fonts: preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Google Analytics: consent denied by default until user accepts cookies -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
      });
      gtag('js', new Date());
      gtag('config', 'G-QLSYF2DZCL');
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QLSYF2DZCL"></script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
