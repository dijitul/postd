<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="postd.uk icon">
  <title>postd.uk</title>

  <!-- Background square with rounded corners for app icon context -->
  <rect width="64" height="64" rx="14" fill="#1E2D4A"/>

  <!-- Inner hex glow layer -->
  <polygon
    points="32,6 56,19.5 56,44.5 32,58 8,44.5 8,19.5"
    fill="#2E4470"
  />

  <!-- Flat-top hexagon, slightly inset -->
  <polygon
    points="32,10 52,21.5 52,42.5 32,54 12,42.5 12,21.5"
    fill="#1E2D4A"
  />

  <!-- Speech bubble -->
  <rect x="13" y="19" width="38" height="24" rx="6" ry="6" fill="#F9F5EE"/>
  <!-- Bubble tail -->
  <path d="M19 43 L15 53 L30 43 Z" fill="#F9F5EE"/>

  <!-- Lightning bolt — amber, bold, centred -->
