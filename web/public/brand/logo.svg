<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" role="img" aria-label="postd.uk">
  <title>postd.uk</title>

  <!-- Hexagon mark -->
  <!-- Flat-top hexagon, 54px tall, centred at 32,32 -->
  <polygon
    points="32,4 56,18 56,46 32,60 8,46 8,18"
    fill="#1E2D4A"
  />

  <!-- Inner hexagon highlight / depth layer -->
  <polygon
    points="32,10 52,21.5 52,42.5 32,54 12,42.5 12,21.5"
    fill="#2E4470"
  />

  <!-- Speech bubble inside hexagon -->
  <!-- Rounded rect bubble -->
  <rect x="15" y="18" width="34" height="22" rx="5" ry="5" fill="#F9F5EE"/>
  <!-- Bubble tail pointing down-left -->
  <path d="M20 40 L17 48 L27 40 Z" fill="#F9F5EE"/>

  <!-- Lightning bolt inside bubble -->
  <!-- Bold, centred bolt -->
  <path
    d="M33 22 L27 32 L31.5 32 L29 42 L35 31 L30.5 31 Z"
    fill="#E07B30"
  />

  <!-- Wordmark: "postd" in Syne Bold -->
  <!-- Using text element; production SVG should embed or reference the font -->
  <text
    x="74"
    y="42"
    font-family="Syne, 'Helvetica Neue', Arial, sans-serif"
    font-weight="700"
    font-size="32"
    letter-spacing="-0.5"
    fill="#1E2D4A"
  >postd</text>

  <!-- Amber dot — the ".uk" punctuation mark, styled as a brand element -->
  <!-- Dot sits tight after the "d", amber filled circle -->
  <circle cx="208" cy="41" r="4.5" fill="#E07B30"/>

  <!-- ".uk" suffix in smaller Syne -->
  <text
    x="216"
    y="42"
    font-family="Syne, 'Helvetica Neue', Arial, sans-serif"
    font-weight="700"
    font-size="16"
    letter-spacing="0"
    fill="#1E2D4A"
  >uk</text>
</svg>
