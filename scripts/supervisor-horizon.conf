; =============================================================================
; Supervisor configuration for Laravel Horizon — postd.uk
;
; Install:
;   cp scripts/supervisor-horizon.conf /etc/supervisor/conf.d/postd-horizon.conf
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl start postd-horizon
;
; Horizon manages its own child worker processes. Supervisor's job here
; is simply to keep the single `horizon` process alive and restart it
; automatically if it crashes or the server reboots.
;
; Do NOT set numprocs > 1 here — Horizon handles worker scaling itself.
; Adjust worker counts and queue priorities in api/config/horizon.php.
; =============================================================================

[program:postd-horizon]
process_name=%(program_name)s

; The Horizon process — runs as the deploy user, NOT root
command=php /var/www/postd/api/artisan horizon

; Start automatically when supervisord starts (e.g. after a reboot)
autostart=true

; Restart Horizon if it exits unexpectedly
autorestart=true

; Run as the deploy user — never root
user=postduk

; Use a single process (Horizon is a process manager itself)
numprocs=1

; Merge stderr into stdout so everything goes to one log file
redirect_stderr=true

; Log file location — inside the Laravel storage directory
stdout_logfile=/var/www/postd/api/storage/logs/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; Give Horizon up to one hour to finish processing current jobs
; before supervisor sends SIGKILL. This matches the default Horizon
; `timeout` value and ensures long-running jobs (AI generation, video
; processing) complete gracefully on deploy.
stopwaitsecs=3600

; Send SIGTERM first — Horizon catches this and triggers a graceful shutdown
stopsignal=SIGTERM

; Kill child worker processes too (not just the Horizon parent)
killasgroup=true
stopasgroup=true

; Delay between auto-restart attempts if Horizon keeps crashing
startsecs=3
startretries=5
