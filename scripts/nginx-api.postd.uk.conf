# =============================================================================
# Nginx Virtual Host: api.postd.uk (Laravel 11 API)
# Domain  : api.postd.uk
# Webroot : /var/www/postd/api/public
# PHP     : PHP-FPM 8.3 (unix socket)
#
# Install:
#   cp scripts/nginx-api.postd.uk.conf /etc/nginx/sites-available/api.postd.uk
#   ln -s /etc/nginx/sites-available/api.postd.uk /etc/nginx/sites-enabled/api.postd.uk
#   nginx -t && systemctl reload nginx
#
# After DNS propagation, run Certbot to upgrade to HTTPS:
#   certbot --nginx -d api.postd.uk --non-interactive \
#     --agree-tos -m hello@postd.uk
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.postd.uk;

    root /var/www/postd/api/public;
    index index.php;

    # --- Logging ---
    access_log /var/log/nginx/api.postd.uk.access.log combined;
    error_log  /var/log/nginx/api.postd.uk.error.log warn;

    # --- CORS headers ---
    # Only allow requests from the postd.uk frontend (both HTTP during dev, HTTPS in prod).
    # Nginx map would be cleaner but this conditional approach works without the map module.
    set $cors_origin "";

    if ($http_origin ~* "^https://(www\.)?postd\.uk$") {
        set $cors_origin $http_origin;
    }

    # Allow localhost for local development against the remote API (optional).
    # Remove if you want strictly production-only access.
    if ($http_origin ~* "^http://localhost(:[0-9]+)?$") {
        set $cors_origin $http_origin;
    }

    # CORS response headers — 'always' ensures they're sent on error responses too
    add_header 'Access-Control-Allow-Origin'      $cors_origin always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, X-Requested-With, X-XSRF-TOKEN, Accept, Origin' always;
    add_header 'Access-Control-Expose-Headers'    'X-RateLimit-Limit, X-RateLimit-Remaining' always;
    add_header 'Access-Control-Max-Age'           '86400' always;

    # --- Handle OPTIONS preflight requests ---
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # --- Security headers ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Tell crawlers this is an API — not a public page
    add_header X-Robots-Tag "noindex, nofollow" always;

    # --- Main location block ---
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- PHP-FPM handler ---
    location ~ \.php$ {
        # Guard against nginx/php-fpm path traversal attack
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;

        # Pass real client IP to Laravel (for rate limiting, logging, etc.)
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        include fastcgi_params;

        # Allow long-running requests (AI generation, scraping jobs via HTTP)
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 30;

        # Buffers — prevents temporary file writes for most responses
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # Let Laravel handle its own error pages (maintenance mode, 503, etc.)
        fastcgi_intercept_errors off;
    }

    # --- Block hidden files, except ACME challenge ---
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- Certbot ACME challenge ---
    location ~ /.well-known/acme-challenge {
        allow all;
        root /var/www/html;
    }

    # --- Stripe webhook endpoint: higher body size limit ---
    # Stripe payloads are small, but this future-proofs webhook receivers.
    location /webhooks/ {
        try_files $uri $uri/ /index.php?$query_string;
        client_max_body_size 2M;
    }

    # --- Static file caching for any assets served from public/ ---
    # (Should be minimal — media goes to DigitalOcean Spaces)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
}
