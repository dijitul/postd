# =============================================================================
# Nginx Virtual Host: postd.uk (React SPA / PWA)
# Domains : postd.uk, www.postd.uk
# Webroot : /var/www/postd/web/dist
#
# Install:
#   cp scripts/nginx-postd.uk.conf /etc/nginx/sites-available/postd.uk
#   ln -s /etc/nginx/sites-available/postd.uk /etc/nginx/sites-enabled/postd.uk
#   nginx -t && systemctl reload nginx
#
# After DNS propagation, run Certbot to upgrade to HTTPS:
#   certbot --nginx -d postd.uk -d www.postd.uk --non-interactive \
#     --agree-tos -m hello@postd.uk
#
# Certbot will modify this file automatically to add the HTTPS server block.
# =============================================================================

# Redirect www to non-www (after SSL is installed)
# Certbot will add a separate HTTPS server block — this redirect
# is handled in the HTTPS block Certbot generates.
server {
    listen 80;
    listen [::]:80;
    server_name postd.uk www.postd.uk;

    root /var/www/postd/web/dist;
    index index.html;

    # --- Logging ---
    access_log /var/log/nginx/postd.uk.access.log combined;
    error_log  /var/log/nginx/postd.uk.error.log warn;

    # --- SPA fallback ---
    # All routes handled by React Router; unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Security headers ---
    # Note: add_header directives in parent block apply to all child locations
    # unless the child also has add_header — in that case, repeat them.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content Security Policy — tighten once all CDN/API origins are known
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.postd.uk;" always;

    # --- Gzip compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        application/wasm
        font/woff2;

    # --- Versioned static assets: aggressive caching ---
    # Vite appends content hashes to filenames — safe to cache for a year.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        log_not_found off;
    }

    # --- PWA service worker and manifest: no caching ---
    # Must always be fresh so updates are picked up immediately.
    location ~* (sw\.js|workbox-[^.]+\.js|manifest\.webmanifest|manifest\.json)$ {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
    }

    # --- Certbot ACME challenge ---
    location ~ /.well-known/acme-challenge {
        allow all;
        root /var/www/html;
    }

    # --- Block hidden files ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
