# =============================================================================
# Nginx Virtual Host: postd.uk (prerendered public site + React SPA / PWA)
# Domains : postd.uk (canonical), www.postd.uk (redirects to apex)
# Webroot : /var/www/postd/web/dist
#
# What is in dist/ (built by `npm run build` in web/):
#   index.html, terms/index.html, guides/<slug>/index.html ...
#                     prerendered public pages with their full content
#   404.html          prerendered "not found" page
#   app.html          empty SPA shell for the signed-in app (noindex)
#   assets/           hashed JS and CSS
#   robots.txt, sitemap.xml, llms.txt, og-image.png, icons/
#
# Routing:
#   1. Real files and prerendered pages are served first
#      (/guides/foo -> /guides/foo/index.html).
#   2. App routes (/dashboard, /posts, /settings ...) get app.html and an
#      X-Robots-Tag: noindex header. React Router takes over from there.
#   3. Anything else is a real 404 with the prerendered 404 page. There is
#      no catch-all SPA fallback any more, so junk URLs are not indexed as
#      copies of the home page.
#
# This file is NOT copied by CI. To apply it on the server:
#   cp /etc/nginx/sites-available/postd.uk /root/postd.uk.nginx.bak
#   cp /var/www/postd/scripts/nginx-postd.uk.conf /etc/nginx/sites-available/postd.uk
#     (or scp it up from your machine, since CI does not ship scripts/)
#   nginx -t && systemctl reload nginx
#
# The certificate paths below are the ones Certbot creates for
# `certbot --nginx -d postd.uk -d www.postd.uk`. Check them with
# `certbot certificates` before reloading. If Certbot has never been run on
# this server, install the HTTP block only, run Certbot, then this file.
# =============================================================================

# X-Robots-Tag for app routes and the SPA shell. Keyed on the original
# request URI because $uri changes to /app.html after try_files. An empty
# value means nginx sends no header at all.
map $request_uri $postd_robots_tag {
    default "";
    ~^/(dashboard|posts|inbox|platforms|settings|billing|admin|onboarding|auth)(/|\?|$) "noindex, nofollow";
    ~^/app\.html "noindex, nofollow";
}

# --- HTTP: everything to HTTPS on the apex domain ---
server {
    listen 80;
    listen [::]:80;
    server_name postd.uk www.postd.uk;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location / {
        return 301 https://postd.uk$request_uri;
    }
}

# --- HTTPS: www to apex ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.postd.uk;

    ssl_certificate     /etc/letsencrypt/live/postd.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postd.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://postd.uk$request_uri;
}

# --- HTTPS: the site ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name postd.uk;

    ssl_certificate     /etc/letsencrypt/live/postd.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postd.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/postd/web/dist;
    index index.html;

    # --- Logging ---
    access_log /var/log/nginx/postd.uk.access.log combined;
    error_log  /var/log/nginx/postd.uk.error.log warn;

    # --- Headers ---
    # add_header is only inherited by locations that have no add_header of
    # their own, so no location below uses add_header. Caching is set with
    # `expires`, which does not break inheritance.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag $postd_robots_tag always;

    # Content Security Policy: tighten once all CDN/API origins are known
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.postd.uk https://www.google-analytics.com;" always;

    charset utf-8;
    charset_types text/plain text/xml application/xml application/json application/javascript text/css;

    # --- Gzip compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/manifest+json
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        application/wasm
        font/woff2;

    # --- Real 404s, with the prerendered page ---
    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }

    # --- PWA service worker, registration script and manifests: never cached ---
    # Must stay fresh so app updates are picked up. Listed before the generic
    # static-file rule, which would otherwise catch sw.js first.
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }
    location ~ ^/(registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest|manifest\.json)$ {
        expires -1;
        try_files $uri =404;
    }

    # --- Hashed build output: cache for a year ---
    location ^~ /assets/ {
        expires max;
        access_log off;
        try_files $uri =404;
    }

    # --- Machine-readable files: correct types, short cache ---
    # These are rebuilt every morning when new guides publish.
    location = /robots.txt {
        types { }
        default_type text/plain;
        expires 1h;
    }
    location = /llms.txt {
        types { }
        default_type text/plain;
        expires 1h;
    }
    location = /sitemap.xml {
        types { }
        default_type application/xml;
        expires 1h;
    }

    # --- Other static files (icons, og-image, brand SVGs): not hashed ---
    location ~* \.(png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # --- App routes: SPA shell, client-rendered, noindex (see map above) ---
    # Keep this list in step with APP_ROUTES in web/vite.config.js.
    location ~ ^/(dashboard|posts|inbox|platforms|settings|billing|admin|onboarding|auth)(/|$) {
        expires -1;
        try_files /app.html =404;
    }

    # --- One URL per page: drop trailing slashes (except the home page) ---
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    # --- Home page ---
    location = / {
        expires -1;
        try_files /index.html =404;
    }

    # --- Public pages: prerendered HTML, otherwise a real 404 ---
    # HTML is revalidated on every visit so a newly published guide, or a
    # new deploy, shows up straight away.
    location / {
        expires -1;
        try_files $uri $uri/index.html =404;
    }

    # --- Block hidden files (but not ACME challenges) ---
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
